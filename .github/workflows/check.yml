name: Check website

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: website-check-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://plusero.github.io' }}
  SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH || '/powersys-faq/' }}
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the project
        run: npm run check
      - name: Build the website
        run: npm run build
      - name: Validate the generated website
        run: npm run validate
